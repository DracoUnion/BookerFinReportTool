[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BookerFinReportTool"
version = "2026.10.10.0"
description = "iBooker/DracoUnion 财务报告工具"
readme = "README.md"
license = {text = "SATA"}
authors = [
    {name = "wizardforcel", email = "wizard.z@qq.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
keywords = ["财务报告", "fin-report", "PDF"]
requires-python = ">=3.8"
dependencies = [
    "openai",
    "httpx",
    "requests",
    "pyyaml",
    "pydantic",
    "json_repair",
    "pymupdf",
    "imgyaso",
    "opencv-python",
    "numpy",
    "pillow",
    "sentence-transformers",
    "flask",
    "ebooklib",
    "waitress",
    "pyturndown",
    "pywin32; sys_platform == 'win32'",
    "ctx-compact",
]

[project.urls]
Homepage = "https://github.com/DracoUnion/BookerFinReportTool"

[project.scripts]
BookerFinReportTool = "BookerFinReportTool.__main__:main"
fin-report = "BookerFinReportTool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BookerFinReportTool*"]

[tool.setuptools.package-data]
"*" = ["*"]
